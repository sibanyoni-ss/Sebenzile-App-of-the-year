services:
  - type: web
    name: lawcompass
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TURBOSMTP_CONSUMER_KEY
        sync: false
      - key: TURBOSMTP_CONSUMER_SECRET
        sync: false
      - key: TURBOSMTP_FROM_EMAIL
        sync: false